# Debezium Server — captures the orders module's public.orders table via Postgres logical
# replication and streams raw row changes to Pulsar.
#
# Topic: <topic.prefix>.<schema>.<table>, delivered under the sink's tenant/namespace, i.e.
# persistent://codelab-orders/local/job.orders-cdc.public.orders. The job kind prefix ("job.")
# comes from topic.prefix here — it must equal the megalith's app.pulsar.jobs.topic-prefix so
# OrderCdcNormalizer's @CodelabJobSubscription (topic = "orders-cdc.public.orders", resolved by
# CodelabTopicResolver to .../job.orders-cdc.public.orders) matches what Debezium produces.

# --- Sink: Pulsar -------------------------------------------------------------
debezium.sink.type=pulsar
debezium.sink.pulsar.client.serviceUrl=pulsar://pulsar:6650
debezium.sink.pulsar.tenant=codelab-orders
debezium.sink.pulsar.namespace=local

# --- Source: Postgres connector ----------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
# "job." keeps externally-produced CDC topics structurally on the job bus (mirrors
# app.pulsar.jobs.topic-prefix in the megalith).
debezium.source.topic.prefix=job.orders-cdc
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=orders
# Built into Postgres (10+), no decoder plugin to install. Requires wal_level=logical
# (set on the postgres service command in docker-compose.yml).
debezium.source.plugin.name=pgoutput
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.orders
debezium.source.slot.name=codelab_orders
# Offset file lives on the debezium_data volume (absolute path: independent of cwd).
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
# We emit no events for deletes (the normalizer ignores op=d), so skip the null-value
# tombstone that follows each delete — Pulsar producers cannot send null values.
debezium.source.tombstones.on.delete=false

# --- Format: plain JSON envelope (no schema wrapper) --------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
