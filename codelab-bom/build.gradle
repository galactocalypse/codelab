plugins {
    id 'com.codelab.gradle'
    id 'java-platform'
}

group = 'com.codelab'
version = '1.0.0'
description = 'Codelab BOM'

javaPlatform {
    allowDependencies()
}

def springBootVersion = '4.1.1'
def codelabVersion = '1.0.0'

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api "com.codelab.codelab-commons:${codelabVersion}"
    constraints {
        api "com.codelab:codelab-commons:${codelabVersion}"
    }
}
