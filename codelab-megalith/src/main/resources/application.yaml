spring:
  application:
    name: codelab
  datasource:
    url: jdbc:postgresql://localhost:5432/codelab
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  aot:
    jpa:
      repositories:
        enabled: false
  pulsar:
    client:
      service-url: pulsar://localhost:6650
    admin:
      service-url: http://localhost:8081
    consumer:
      subscription:
        type: shared
        mode: durable
        initial-position: earliest
    producer:
      send-timeout: 10s
logging:
  level:
    org.hibernate.tool.schema: DEBUG
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui
app:
  pulsar:
    tenant.prefix: codelab-
    namespace: local