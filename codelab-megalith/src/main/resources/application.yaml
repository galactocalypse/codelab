spring:
  application:
    name: codelab
  datasource:
    url: jdbc:postgresql://localhost:5432/codelab
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  aot:
    jpa:
      repositories:
        enabled: false
  pulsar:
    client:
      service-url: pulsar://localhost:6650
    admin:
      service-url: http://localhost:8081
    consumer:
      subscription:
        type: shared
        mode: durable
        initial-position: earliest
    producer:
      send-timeout: 10s
logging:
  level:
    org.hibernate.tool.schema: DEBUG
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui
app:
  pulsar:
    tenant.prefix: codelab-
    namespace: local
    # Kind prefixes: every physical topic is .../event.<name> or .../job.<name>, applied
    # by CodelabTopicResolver at both publisher and listener registration. Keeps the two
    # buses structurally disjoint within a module's tenant; blank disables (escape hatch
    # for externally-produced topics such as Debezium's — those must match by config).
    # App-level publish size caps, enforced in the publisher path before anything
    # reaches the broker. Events stay small (a business fact); jobs may carry bulk
    # payloads. The broker-side ceiling is docker-compose's PULSAR_PREFIX_maxMessageSize.
    events:
      topic-prefix: event
      max-message-size: 1KB
    jobs:
      topic-prefix: job
      max-message-size: 100KB