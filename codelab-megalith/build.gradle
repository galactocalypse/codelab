plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'com.codelab.gradle'
}

group = 'com.codelab'
version = '1.0.0'
description = 'Codelab Megalith'

dependencies {
    compileOnly 'org.projectlombok:lombok'

    implementation platform('com.codelab:codelab-bom:1.0.0')
    implementation 'com.codelab:codelab-commons:1.0.0'
    implementation 'com.codelab:codelab-movies:1.0.0'
    implementation 'com.codelab:codelab-orders:1.0.0'

    annotationProcessor platform('com.codelab:codelab-bom:1.0.0')
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.springframework.boot:spring-boot-starter-pulsar'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'

    testAnnotationProcessor platform('com.codelab:codelab-bom:1.0.0')
    testAnnotationProcessor 'org.projectlombok:lombok'
}
test {
    useJUnitPlatform()
}
