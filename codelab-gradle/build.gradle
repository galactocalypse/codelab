plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id("com.diffplug.spotless") version "8.10.2"
}

group = 'com.codelab'
version = '1.0.0'

repositories {
    gradlePluginPortal()
    mavenCentral()
}

gradlePlugin {
    plugins {
        codelab {
            id = 'com.codelab.gradle'
            implementationClass = 'com.codelab.gradle.CodelabGradlePlugin'
        }

        codelabSettings {
            id = 'com.codelab.settings'
            implementationClass = 'com.codelab.gradle.CodelabSettingsPlugin'
        }
    }
}

publishing {
    repositories {
        mavenLocal()
    }
}

dependencies {
    // Required by CodelabJavaQualityPlugin
    implementation 'com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.10.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        // Use a standard formatter like Google Java Format
        googleJavaFormat()
        // Define which files to format
        target("src/**/*.java")
    }
    // Optional: configuration for build scripts
    kotlinGradle {
        target("*.gradle.kts")
        ktlint()
    }
}

test {
    useJUnitPlatform()
}
