services:

  postgres:
    image: postgres:18
    container_name: postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:4.2.4
    container_name: pulsar
    hostname: pulsar
    profiles: ["pulsar"]
    restart: unless-stopped

    ports:
      - "6650:16650" # IntelliJ -> external listener
      - "8081:8080"  # Admin API

    environment:
      PULSAR_PREFIX_advertisedAddress: "pulsar"

      # Both listeners must be advertised because your 4.2.4 validator
      # requires internalListenerName to exist in advertisedListeners.
      PULSAR_PREFIX_advertisedListeners: "internal:pulsar://pulsar:6650,external:pulsar://localhost:6650"

      # ONLY the additional external socket goes here.
      # The internal socket is already created from brokerServicePort=6650.
      PULSAR_PREFIX_bindAddresses: "external:pulsar://0.0.0.0:16650"

      PULSAR_PREFIX_internalListenerName: "internal"

    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env.py conf/standalone.conf
        exec bin/pulsar standalone

    volumes:
      - pulsar_data:/pulsar/data
      - pulsar_conf:/pulsar/conf

    healthcheck:
      test:
        - CMD
        - bin/pulsar-admin
        - brokers
        - healthcheck
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  pulsar-manager:
    image: apachepulsar/pulsar-manager:v0.4.0
    container_name: pulsar-manager
    profiles: ["pulsar"]
    restart: unless-stopped
    ports:
      - "9527:9527"
      - "7750:7750"
    environment:
      SPRING_CONFIGURATION_FILE: /pulsar-manager/pulsar-manager/application.properties
    volumes:
      - pulsar_manager_data:/pulsar-manager/pulsar-manager/dbdata
    depends_on:
      pulsar:
        condition: service_healthy

  redis:
    image: redis:8.8
    container_name: redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    profiles: ["cassandra"]
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: local_cluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  neo4j:
    image: neo4j:2026.08.1
    profiles:
      - neo4j
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  postgres_data:
  redis_data:
  pulsar_data:
  pulsar_conf:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  pulsar_manager_data:
